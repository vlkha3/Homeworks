pre-commit:
  parallel: true
  jobs:
    - name: Oxfmt
      glob:
        - '*.{html,htm,css,scss,js,ts,mjs,cjs,json,yml,yaml,md}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: Stylelint
      glob:
        - '*.{css,scss,html,htm}'
      run: pnpm exec stylelint --fix --allow-empty-input {staged_files}
      stage_fixed: true
